<!DOCTYPE html>
<html lang="en">
<!-- Reactive Type: type that reads your tone and reacts as you write. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reactive Type</title>
<meta name="description" content="Type that reads your tone and reacts as you write.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body data-mode="write">
<div class="field" aria-hidden="true">
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
  <div class="grid"></div>
</div>

<header class="hud top">
  <p class="mark">reactive_type<span class="blink">_</span></p>
  <p class="readout" aria-live="polite"><span class="k">face</span> <span id="face-name">departure mono</span> <span class="dim" id="face-class">/ waiting for tone</span></p>
</header>

<main class="stage">
  <div class="surface" id="surface">
    <div class="mirror" id="mirror" aria-hidden="true"></div>
    <label for="input" class="sr-only">Write something</label>
    <textarea id="input" rows="1" spellcheck="false" placeholder="Start typing. The type is listening."></textarea>
  </div>
  <aside class="notes" id="notes" aria-live="polite" aria-label="Reading"></aside>
</main>

<aside class="meters" id="meters" aria-label="Tone, live"></aside>

<footer class="hud bottom">
  <p class="status" id="status" aria-live="polite"></p>
  <p class="keys" id="keys"></p>
</footer>

<script type="module" src="src/app.js"></script>
</body>
</html>
